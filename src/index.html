<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>神經系統 3D 專頁｜互動人體解剖探索</title>
  <meta name="description" content="神經系統 3D 專頁：中樞神經、腦神經、脊神經與骨骼系統 3D 互動探索，支援旋轉、縮放、平移與個別構造顯示隱藏。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="神經系統 3D 專頁">
  <meta property="og:description" content="神經系統 3D 專頁：中樞神經、腦神經、脊神經與骨骼系統 3D 互動探索，支援旋轉、縮放、平移與個別構造顯示隱藏。">
  <meta name="theme-color" content="#0a0e17">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="%BASE_URL%manifest.webmanifest">
  <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml">
</head>
<body class="neuro-app">
  <header class="app-header">
    <div class="brand-group">
      <svg class="brand-icon" viewBox="0 0 36 36" aria-hidden="true" focusable="false">
        <circle cx="18" cy="18" r="15" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3 2"/>
        <path d="M18 5v26M5 18h26" fill="none" stroke="#a855f7" stroke-width="1.4" opacity="0.7"/>
        <circle cx="18" cy="18" r="6" fill="#06b6d4" opacity="0.8"/>
        <circle cx="18" cy="18" r="3" fill="#ffffff"/>
      </svg>
      <div class="brand-titles">
        <h1 class="brand-main-title">神經系統 3D 專頁</h1>
        <p class="brand-sub-title">中樞・腦神經・脊髓・周邊神經・骨骼系統</p>
      </div>
    </div>

    <!-- Quick Presets in Header -->
    <nav class="header-presets" aria-label="快速組合">
      <button type="button" class="preset-btn active" data-preset="all">全部顯示</button>
      <button type="button" class="preset-btn" data-preset="nervesOnly">僅神經系統</button>
      <button type="button" class="preset-btn" data-preset="nervesAndSpine">神經＋脊椎</button>
      <button type="button" class="preset-btn" data-preset="nervesAndSkeleton">神經＋全身骨骼</button>
    </nav>

    <div class="header-tools">
      <button id="sidebar-toggle" class="sidebar-toggle-btn" type="button" aria-label="開啟控制面板">
        ☰ <span>構造控制面板</span>
      </button>
      <button id="language-toggle" class="lang-btn" type="button" lang="en" aria-label="Switch the interface to English">English</button>
    </div>
  </header>

  <main class="main-workspace">
    <!-- 3D Canvas Stage Container -->
    <div id="stage" class="viewer-stage" aria-label="神經系統 3D 畫面">
      <!-- Loading Progress Overlay -->
      <div id="loading-overlay" class="loading-overlay">
        <div class="loading-card">
          <div class="loading-spinner"></div>
          <p id="loading-text" class="loading-status">載入解剖模型中...</p>
          <div class="progress-bar-bg">
            <div id="loading-progress" class="progress-bar-fill"></div>
          </div>
        </div>
      </div>

      <!-- Floating Viewport Navigation HUD -->
      <div class="viewport-hud" role="toolbar" aria-label="視角與操作工具">
        <div class="hud-group">
          <button id="btn-zoom-in" type="button" class="hud-btn" title="放大" aria-label="放大">＋</button>
          <button id="btn-zoom-out" type="button" class="hud-btn" title="縮小" aria-label="縮小">－</button>
        </div>

        <div class="hud-group">
          <button id="btn-drag-mode" type="button" class="hud-btn" title="模式切換" aria-label="模式切換">↻</button>
          <button id="btn-reset-view" type="button" class="hud-btn" title="重設視角" aria-label="重設視角">⌖</button>
        </div>

        <div class="hud-group view-presets-group" aria-label="視角切換">
          <button type="button" class="hud-btn view-btn" data-view="front">正面</button>
          <button type="button" class="hud-btn view-btn" data-view="back">背面 (脊髓與脊神經)</button>
          <button type="button" class="hud-btn view-btn" data-view="left">側面</button>
          <button type="button" class="hud-btn view-btn" data-view="head">聚焦頭部</button>
          <button type="button" class="hud-btn view-btn" data-view="spine">聚焦脊椎</button>
        </div>
      </div>

      <!-- Floating Structure Inspector Card -->
      <aside id="structure-inspector" class="structure-inspector" hidden aria-label="解剖資訊檢視">
        <div class="inspector-header">
          <span id="inspector-category" class="inspector-badge">系統分類</span>
          <button id="inspector-close-btn" type="button" class="inspector-close" aria-label="關閉 ✕">✕</button>
        </div>
        <h3 id="inspector-title" class="inspector-name">構造名稱</h3>
        <p id="inspector-en" class="inspector-latin">Latin / English Name</p>
        <p id="inspector-desc" class="inspector-summary">構造解剖功能與臨床重點說明...</p>
        <div class="inspector-actions">
          <button id="inspector-hide-btn" type="button" class="inspector-hide-btn">隱藏此構造</button>
        </div>
      </aside>
    </div>

    <!-- Collapsible Controls Sidebar -->
    <aside id="neuro-sidebar" class="neuro-sidebar" aria-label="構造控制面板">
      <div class="sidebar-header">
        <h2 class="sidebar-title">構造控制面板</h2>
        <button id="sidebar-close" type="button" class="sidebar-close-btn" aria-label="關閉控制面板">✕</button>
      </div>

      <div class="sidebar-content">
        <!-- Search Box -->
        <div class="search-box">
          <input id="structure-search" type="search" placeholder="搜尋構造名稱..." aria-label="搜尋構造名稱...">
        </div>

        <!-- Silhouette Background & Bone Modes Card -->
        <section class="panel-section backdrop-section">
          <h3 class="section-title">人體外框背景</h3>
          <div class="setting-row">
            <label class="toggle-label">
              <input id="silhouette-toggle" type="checkbox" checked>
              <span>顯示人體外框輪廓</span>
            </label>
          </div>
          <div class="setting-row slider-row">
            <label for="silhouette-slider">外框透明度</label>
            <input id="silhouette-slider" type="range" min="0" max="0.5" step="0.02" value="0.22">
          </div>

          <div class="setting-row separator-top">
            <label class="toggle-label">
              <input id="ghost-bones-toggle" type="checkbox" checked>
              <span>半透明骨骼模式 (透視內部神經)</span>
            </label>
          </div>
        </section>

        <!-- Dynamic Structure Hierarchy (Brain, Cranial, Cord, Peripheral, Skull, Skeleton) -->
        <div id="structure-hierarchy" class="hierarchy-container">
          <!-- Filled dynamically by main.js -->
        </div>
      </div>
    </aside>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
